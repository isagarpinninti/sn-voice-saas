<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZeVox Widget Preview</title>
<style>
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#e8f5f0 0%,#dbeafe 50%,#f0fdf4 100%)}
.info{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:white;padding:8px 20px;border-radius:20px;font-size:12px;color:#6b7280;box-shadow:0 1px 6px rgba(0,0,0,.1);font-family:system-ui,sans-serif;z-index:9999;white-space:nowrap}
.btns{position:fixed;top:60px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:9999}
.btns button{padding:6px 14px;border-radius:8px;border:1px solid #d1d5db;background:white;font-size:12px;cursor:pointer;font-family:system-ui,sans-serif}
.btns button.active{background:#059669;color:white;border-color:#059669}
</style>
</head>
<body>
<div class="info">ZeVox Widget Preview — click a mode to preview</div>
<div class="btns">
  <button onclick="setMode('voice_only')" class="active" id="b1">Voice Only</button>
  <button onclick="setMode('chat_only')" id="b2">Chat Only</button>
  <button onclick="setMode('both')" id="b3">Both</button>
</div>
<script>
function setMode(m){
  document.querySelectorAll('.btns button').forEach(b=>b.classList.remove('active'))
  event.target.classList.add('active')
  var el=document.getElementById('zv')
  if(el)el.remove()
  window.__zv=false
  window.ZEVOX_TOKEN='preview_'+m
  window._previewMode=m
  loadWidget()
}
function loadWidget(){
  var s=document.createElement('script')
  s.src='/widget.js?_='+Date.now()
  document.body.appendChild(s)
}
var _fetch=window.fetch
window.fetch=function(url){
  if(typeof url==='string'&&url.includes('/api/widget/config')){
    return Promise.resolve({json:()=>Promise.resolve({
      widgetMode:window._previewMode||'voice_only',
      agentName:'ZeVox AI',
      showBranding:true,
      greeting:'Hi! How can I help you today?'
    })})
  }
  return _fetch.apply(window,arguments)
}
window.ZEVOX_TOKEN='preview_voice_only'
window._previewMode='voice_only'
loadWidget()
</script>
</body>
</html>
